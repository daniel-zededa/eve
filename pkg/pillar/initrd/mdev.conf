# mdev rules of the VMs that container apps run in (runx-initrd). mdev is the
# kernel's hotplug helper there, for usb devices the host passes through to
# the VM while the app runs: devtmpfs creates their nodes, mdev loads their
# drivers and adds the links applications look for, named as udev names them
# on the host.
$MODALIAS=.*    root:root 0660 @modprobe -b -q "$MODALIAS"
video[0-9]+     root:root 0660 */usb-links
ttyACM[0-9]+    root:root 0660 */usb-links
ttyUSB[0-9]+    root:root 0660 */usb-links
