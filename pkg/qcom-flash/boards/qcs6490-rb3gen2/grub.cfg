# Qualcomm RB3 Gen 2 GRUB settings, appended to grub-qcom.cfg in the ESP's
# /EFI/BOOT/grub-hv.cfg

# RB3 Gen 2 device tree from the EVE kernel, EL2 variant (kodiak-el2 overlay):
# the board boots with xbl_config_kvm.elf (no Gunyah), so Linux runs at EL2
# for KVM. Without it, the kernel uses the device tree from the UEFI firmware
# (dtb_a/dtb_b).
set_to_existing_file devicetree "/boot/dtb/qcom/qcs6490-rb3gen2-el2.dtb"

set_global dom0_platform_tweaks "net.ifnames=0 earlycon"
